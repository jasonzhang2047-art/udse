<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Decision Simulator</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <a class="skip" href="#app">Skip to content</a>
  <header class="topbar">
    <a href="#/" class="brand" aria-label="Decisions home">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 18c3-8 6-12 8-12s5 4 8 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="4" cy="18" r="2" fill="currentColor"/><circle cx="12" cy="6" r="2" fill="currentColor"/><circle cx="20" cy="18" r="2" fill="currentColor"/></svg>
      <span>Decision Simulator</span>
    </a>
    <button id="who" class="who" type="button" aria-label="Switch user"></button>
  </header>
  <main id="app" tabindex="-1" aria-live="polite"></main>
  <nav class="tabbar" aria-label="Primary">
    <a href="#/" data-nav="home">Decisions</a>
    <a href="#/profile" data-nav="profile">My profile</a>
    <a href="#/audit" data-nav="audit">Boundary log</a>
  </nav>
  <div id="sheet" class="sheet" role="dialog" aria-modal="true" hidden>
    <div class="sheet-card">
      <button class="sheet-close" type="button" aria-label="Close">×</button>
      <div id="sheet-body"></div>
    </div>
  </div>
  <script src="/static/app.js"></script>

</html>

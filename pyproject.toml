[project]
name = "udse"
version = "0.5.0"
description = "Universal Decision Simulation Engine — v0.5 reference implementation (dynamic, evidence-grounded decision-scoped world models)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.11",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
llm = ["anthropic>=0.70"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
udse = "udse.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/udse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

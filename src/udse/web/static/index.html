<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>Futures — Decision Simulator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/static/styles.css">
  <script>
    try { const t = localStorage.getItem("udse_theme"); if (t === "dark" || t === "light") document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#app">Skip to content</a>
  <header class="topbar">
    <a href="#/" class="brand" aria-label="Worlds home">
      <svg viewBox="0 0 28 28" width="26" height="26" aria-hidden="true" class="brand-mark">
        <path d="M3 14h7" class="bm-trunk"/><path d="M10 14c4 0 5-7 9-7h6" class="bm-a"/><path d="M10 14h15" class="bm-b"/><path d="M10 14c4 0 5 7 9 7h6" class="bm-c"/>
        <circle cx="10" cy="14" r="2.4" class="bm-node"/>
      </svg>
      <span class="brand-name">Futures</span>
    </a>
    <nav class="topnav" aria-label="Primary">
      <a href="#/" data-nav="home">Worlds</a>
      <a href="#/agent" data-nav="agent">Your Agent</a>
      <a href="#/integrity" data-nav="integrity">Integrity</a>
    </nav>
    <div class="top-actions">
      <button id="theme" class="icon-btn" type="button" aria-label="Switch colour theme" title="Theme"></button>
      <button id="who" class="who" type="button" aria-label="Switch participant"></button>
    </div>
  </header>
  <main id="app" tabindex="-1"></main>
  <nav class="tabbar" aria-label="Primary (mobile)">
    <a href="#/" data-nav="home"><span aria-hidden="true">◎</span>Worlds</a>
    <a href="#/agent" data-nav="agent"><span aria-hidden="true">◐</span>Your Agent</a>
    <a href="#/integrity" data-nav="integrity"><span aria-hidden="true">⛨</span>Integrity</a>
  </nav>
  <div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
    <div class="sheet-card">
      <button class="sheet-close" type="button" aria-label="Close">×</button>
      <div id="sheet-body"></div>
    </div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
